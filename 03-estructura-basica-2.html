<!--

    Para crear la estructura básica podemos usar Emmet.

    Emmet es una herramienta de autocompletado integrada en VSC.

    El shortcut para escribir la estructura: !

    Atributos

    lang -> Define el idioma del contenido del documento.
    chasret -> Define el conjunto de caracteres que se utilizará en el documento.

    Etiquetas

    Meta viewport -> Permite controlar la forma en que se visualiza correctamente dentro del contenido en dispositivos móviles. Siempre debe estar. Las etiquetas meta se autocierran 'selfclosing'. No tienen una etiqueta de cierre.
    
    title -> Define el título del documento. Este titulo si es visible para el usuario y se ubica en las pestañas del navegador.




-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIUUUDAAAA</title>
</head>
<body>
    
</body>
</html>
