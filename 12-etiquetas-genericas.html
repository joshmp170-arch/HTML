<!--

    Etiquetas genéricas

    Existen dos que nos ayudan a crear elementos de tipo bloque y linea.

    - div: Se usa como un contenedor de division y semanticamente no significa nada. Sirve como contender el bloque. 

    - span: Es un contenedor de tipo linea, se suele usar para encerrar palabras o peuqeños textos. Semánticamente no significa nada.

    - Contenedor de bloque: Ocupan todo el ancho disponible y darán un salto de linea.

    - Contenedor de Linea: Va ocupar el ancho de su contenido y no da salto de linea.

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiquetas Genericas</title>
</head>
<body>
    <h1> Etiquetas Genericas</h1>

    <div>
        Este es un <span style="color:red">elemento</span> de bloque!
    </div>

    <div>
        Este es otro elemento de bloque! <span> Y este es otro elemento de linea!</span>
    </div>
<body>
<html>
