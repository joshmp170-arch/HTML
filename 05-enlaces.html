<!--
    
    Enlaces

    Los enlaces nos permiten crear navegaciones internas y externas html.

    Sintaxis:

    <a>...</a>

    Los enlaces requieren del atributo href para poder funcionar como elementos de navegación. El atributo href nos permite definir la ruta a la que queremos dirigirnos.

    Sintaxis:

    <a href="...">...</a>
    
    Los atributos "href" pueden recibir varios valores, los principales son:

    - URL externa
    - La ruta (path) de un archivo html
    - El id de un elemento de html
    - #Deadlink (Enlace muerto)

    El atributo "target" nos permite definir la forma en que se abrirá una pestaña nueva cuando usamos el valor "_blank"

    
    -->


    <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlaces</title>
</head>
<body>
    <a href="https://www.tiktok.com" target="_blank">Esto es un enlace externo!</a>
    <br>
    <a href="04-etiquetas-texto.html">Esto es un enlace html!</a>
    <br>
    <a href="#subtitle">Este es un enlace hacia un elemento de html</
     

    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>

    <br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>


    <h2 id="subtitle">Elemento para enlazar</h2>

</body>
</html>
