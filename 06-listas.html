<!--


    Listas

    Nos ayudan a estructurar informacion ordenada y no odernada.

    Ordenadas -> Llevan enumeracion y la sintaxis es:

    <ol>...</ol>

    No ordenadas -> Llevan bullets o viñetas y la sintaxis es:

    <ul>...</ul>

    Para los elementos de lista se usa la sintaxis:

    <li>...</li>

    Existe el atributo "type" que nos permite cambiar el tipo de enumeracion y disc que queremos usar en las listas ordenadas.
    Los valores que puede recibir son:
    
    - "1" -> Numeros default
    - "a/A" -> Letras alfabeticas
    - "i/I" -> Numeros romanos

    Para las listas no odenadas los valores son:

    - disc -> balas o puntitos (default)
    - square -> Cuadrados
    - circle -> Circulos

-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <h1>Listas</h1>
    <p>Tenemos listas ordenadas y no ordenadas.</p>

    <h2>Mi comida favorita</h2>
    <ol type="i">
        <li>Pizza</li>
        <li>Tacos</li>
        <li>Esquites</li>
    </ol>

    <h2>Mis hobbies</h2>
    <ul type="square">
        <li>Jugar videojuegos</li>
        <li>Dibujar</li>
        <li>Tomar foticos</li>
    </ul>
</body>
</html>
