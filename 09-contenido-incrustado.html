<!-- 
 
Contenido incrustado (Iframes)

Sirve para incrustar contenido externo como videos de yt, mapas, documentos, interfaces...

- src: direccion del contenido
- width: ancho del iframe
- height: alto del iframe
- allowfullscreen: permite que el contenido se muestre en pantalla completa


-->

!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contenido Incrustado</title>
</head>
<body>

    <h1>Iframes</h1>

    <h2>Video de Youtube</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/b_98AbK-nhk?si=aKXaAA9syhDNMSQM" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

    <h2>Mapa de Google Maps</h2>
    <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d943.2547459823556!2d-98.19946494241377!3d18.974768986893014!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses-419!2smx!4v1792444786221!5m2!1ses-419!2smx" width="400" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

    <h2>Revista Enfoco</h2>
    <iframe src="https://heyzine.com/flip-book/383f213883.html#page/1" frameborder="0" width="1024px" height="600px"></iframe>
