<!--

    Estrutura basica

    <!DOCTYPE html> ->Declara el tipo de documento y la version de HTML que se esta utilizando.
    
    <html> ->Es el "elemento raíz" que contiene todo el contenido del documento.

    <head> ->Contiene metadatos sobre el documento: p. ej. conjunto de caractéres, vista para dispositivos móviles o el título del documento.
    
    <body> ->Contiene el contenido visible del documento, como titulos, imágenes, parrafos, formularios, etc...

-->

<!DOCTYPE html>
<html>
    <head></head>
    <body></body>
</html>
